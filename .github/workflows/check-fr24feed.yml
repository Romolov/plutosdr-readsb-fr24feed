name: Check for new fr24feed release

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query latest fr24feed version from APT repo
        id: check
        run: |
          PACKAGES_URL="https://repo-feed.flightradar24.com/dists/flightradar24/raspberrypi-stable/binary-armhf/Packages"

          LATEST=$(curl -fsSL "$PACKAGES_URL" 2>/dev/null \
            | grep -A1 "^Package: fr24feed$" \
            | grep "^Version:" \
            | head -1 \
            | awk '{print $2}')

          if [ -z "$LATEST" ]; then
            LATEST=$(curl -fsSL "${PACKAGES_URL}.gz" 2>/dev/null \
              | gunzip \
              | grep -A1 "^Package: fr24feed$" \
              | grep "^Version:" \
              | head -1 \
              | awk '{print $2}')
          fi

          if [ -z "$LATEST" ]; then
            echo "::warning::Could not determine latest fr24feed version"
            exit 0
          fi

          # Verify the .tgz actually exists before bumping
          HTTP_CODE=$(curl -sI -o /dev/null -w "%{http_code}" \
            "https://repo-feed.flightradar24.com/rpi_binaries/fr24feed_${LATEST}_armhf.tgz")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::APT says ${LATEST} but .tgz not found (HTTP ${HTTP_CODE}), skipping"
            exit 0
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest fr24feed: $LATEST (.tgz confirmed)"

      - name: Read current tracked version
        id: current
        run: |
          CURRENT=$(cat FR24FEED_VERSION | tr -d '[:space:]')
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Bump version and push
        if: >-
          steps.check.outputs.latest != ''
          && steps.check.outputs.latest != steps.current.outputs.version
        run: |
          NEW="${{ steps.check.outputs.latest }}"
          OLD="${{ steps.current.outputs.version }}"
          echo "Version change: $OLD -> $NEW"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "$NEW" > FR24FEED_VERSION
          git add FR24FEED_VERSION
          git commit -m "bump fr24feed to ${NEW}"
          git push origin main
